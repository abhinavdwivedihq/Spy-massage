<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Spy Message</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --ink: #2B2033;
    --ink-2: #1F1726;
    --panel: #FFFFFF;
    --panel-2: #FFF1F6;
    --brass: #3AA0D6;
    --brass-soft: #2E86B8;
    --paper: #2B2033;
    --slate: #9A8B97;
    --red: #C1443F;
    --green: #4C8B6E;
    --font-display: 'Baloo 2', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --grad: linear-gradient(115deg, #ec4899 0%, #a855f7 55%, #4f6bf0 100%);
    --grad-soft: linear-gradient(115deg, rgba(236,72,153,0.12), rgba(79,107,240,0.12));
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body{
    margin:0;
    background: linear-gradient(160deg, #FBD6E3 0%, #FCE3EC 32%, #FFFFFF 62%, #FFFFFF 100%);
    color: var(--paper);
    font-family: var(--font-body);
    min-height: 100vh;
    padding-bottom: 48px;
  }

  body::before{
    content:'';
    position: fixed; inset:0;
    background-image:
      linear-gradient(rgba(58,160,214,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(58,160,214,0.05) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
    z-index: 0;
  }

  .wrap{ position: relative; z-index:1; max-width: 480px; margin: 0 auto; padding: 22px 18px 0; }

  /* ---------- header / seal & lang switch ---------- */
  header{ display:flex; align-items:center; justify-content: space-between; margin-bottom: 22px; }
  .header-left { display: flex; align-items: center; gap: 14px; }

  .lang-switch{
    background: var(--panel);
    border: 1px solid rgba(168,85,247,0.3);
    padding: 6px 12px;
    border-radius: 20px;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--paper);
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(43,32,51,0.05);
    transition: all 0.2s ease;
  }
  .lang-switch:active { transform: scale(0.95); }

  .seal{
    width:62px; height:62px; border-radius:50%;
    padding: 3px;
    background: var(--grad);
    display:flex; align-items:center; justify-content:center;
    position:relative; flex-shrink:0; overflow:hidden;
    box-shadow: 0 4px 16px rgba(168,85,247,0.30);
  }
  .seal::after{
    content:''; position:absolute; inset:3px; border-radius:50%;
    background:#16233A; z-index:0;
  }
  .seal img{ width:100%; height:100%; object-fit:cover; position:relative; z-index:1; border-radius:50%; }

  .brand h1{
    font-family: var(--font-display); font-weight:700; font-size: 22px;
    margin:0; color: var(--paper); letter-spacing:0.2px;
  }
  .brand p{ margin: 2px 0 0; font-size: 12px; color: var(--slate); font-family: var(--font-mono); letter-spacing: 0.5px; }

  /* ---------- tabs ---------- */
  .tabs{
    display:flex; background: var(--panel); border-radius: 14px; padding: 4px;
    border: 1px solid rgba(58,160,214,0.15); margin-bottom: 18px;
    box-shadow: 0 6px 20px rgba(43,32,51,0.06);
  }
  .tab{
    flex:1; text-align:center; padding: 11px 0; border-radius: 10px;
    font-family: var(--font-display); font-weight:600; font-size: 15.5px;
    color: var(--slate); cursor:pointer; transition: all .25s ease; user-select:none;
    border: none; background: none;
  }
  .tab.active{ background: var(--grad); color: #fff; box-shadow: 0 6px 16px rgba(168,85,247,0.30); }

  /* ---------- panel ---------- */
  .panel{
    display:none; background: var(--panel);
    border: 1px solid rgba(58,160,214,0.14);
    border-radius: 18px; padding: 20px; margin-bottom: 16px;
    animation: fadeIn .35s ease;
    box-shadow: 0 10px 30px rgba(43,32,51,0.07);
  }
  .panel.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform: translateY(6px);} to{opacity:1; transform:none;} }

  .label{
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 1px;
    color: var(--brass-soft); text-transform: uppercase; margin-bottom: 8px; display:block;
  }

  .photo-drop{
    border: 1.5px dashed rgba(168,85,247,0.35); border-radius: 14px;
    height: 190px; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:8px; cursor:pointer; overflow:hidden; position:relative;
    background: var(--grad-soft); margin-bottom: 16px; transition: border-color .2s;
  }
  .photo-drop:active{ border-color: #a855f7; }
  .photo-drop .cam-icon{
    width:60px; height:60px; border-radius:50%;
    background: rgba(168,85,247,0.12);
    display:flex; align-items:center; justify-content:center;
    font-size:26px; margin-bottom:2px;
  }
  .photo-drop img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .photo-drop .hint{ color: var(--slate); font-size: 13px; text-align:center; padding: 0 20px; }
  .photo-drop .hint b{ color: var(--paper); display:block; font-family: var(--font-display); font-size:15px; margin-bottom:2px; }
  input[type=file]{ display:none; }

  textarea{
    width:100%; background: var(--panel-2); border: 1px solid rgba(58,160,214,0.18);
    border-radius: 12px; color: var(--paper); font-family: var(--font-body); font-size: 14.5px;
    padding: 12px 14px; resize: none; min-height: 90px; margin-bottom: 6px;
  }
  textarea:focus{ outline: none; border-color: var(--brass); }
  .charcount{ text-align:right; font-size:11px; color: var(--slate); font-family: var(--font-mono); margin-bottom:16px; }

  select{
    width:100%; background: var(--panel-2); border: 1px solid rgba(58,160,214,0.18);
    color: var(--paper); font-family: var(--font-body); font-size:14.5px;
    padding: 12px 14px; border-radius: 12px; margin-bottom: 20px; appearance:none;
    background-image: linear-gradient(45deg, transparent 50%, var(--brass) 50%), linear-gradient(135deg, var(--brass) 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 13px) center;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }

  .btn{
    width:100%; padding: 14px; border-radius: 12px; border:none;
    font-family: var(--font-display); font-weight:700; font-size: 16px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
    transition: transform .12s ease, opacity .2s;
  }
  .btn:active{ transform: scale(0.98); }
  .btn:disabled{ opacity:0.55; }
  .btn-primary{ background: var(--grad); color: #fff; box-shadow: 0 8px 20px rgba(168,85,247,0.35); }

  .radar{
    width:16px; height:16px; border-radius:50%; border: 2px solid rgba(255,255,255,0.85);
    border-top-color: transparent; animation: spin .8s linear infinite; display:none;
  }
  .btn.loading .radar{ display:inline-block; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .result{
    margin-top: 16px; border-radius: 14px; padding: 18px; display:none;
    border: 1px solid; animation: fadeIn .3s ease;
  }
  .result.show{ display:block; }
  .result.ok{ background: rgba(92,154,124,0.1); border-color: var(--green); }
  .result.err{ background: rgba(178,76,61,0.1); border-color: var(--red); }
  .result .tag{ font-family: var(--font-mono); font-size: 10.5px; letter-spacing:1px; text-transform:uppercase; margin-bottom:8px; }
  .result.ok .tag{ color: var(--green); }
  .result.err .tag{ color: var(--red); }
  .result .msg{ font-size: 15.5px; line-height:1.5; white-space: pre-wrap; }
  .result .meta{ margin-top:10px; font-size:11.5px; color: var(--slate); font-family: var(--font-mono); }

  canvas{ display:none; }
</style>
</head>
<body>

<div class="wrap">
  <!-- Header -->
  <header>
    <div class="header-left">
      <div class="seal">
        <!-- Logo Image Added Here -->
        <img src="{data_uri}" alt="Spy Message Logo">
      </div>
      <div class="brand">
        <h1 id="app-title">गुप्त संदेश</h1>
        <p id="app-subtitle">SECURE PHOTO ENCRYPTION</p>
      </div>
    </div>
    <!-- Top Right Language Switch Button -->
    <button class="lang-switch" onclick="toggleLanguage()" id="langBtn">EN / हिंदी</button>
  </header>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('create')" id="tabCreate">संदेश छुपाएं</button>
    <button class="tab" onclick="switchTab('read')" id="tabRead">संदेश पढ़ें</button>
  </div>

  <!-- Create Panel -->
  <div class="panel active" id="panelCreate">
    <span class="label" id="lblPhoto">1. फोटो चुनें</span>
    <div class="photo-drop" onclick="document.getElementById('fileInput').click()" id="dropZone">
      <div class="cam-icon">📷</div>
      <div class="hint">
        <b id="dropTitle">तस्वीर अपलोड करें</b>
        <span id="dropSub">टैप करें या फोटो चुनें</span>
      </div>
      <img id="previewImg" style="display:none;">
    </div>
    <input type="file" id="fileInput" accept="image/*" onchange="handleImage(this)">

    <span class="label" id="lblSecret">2. गुप्त संदेश लिखें</span>
    <textarea id="secretInput" placeholder="यहाँ अपना गुप्त संदेश टाइप करें..." oninput="updateCount()"></textarea>
    <div class="charcount" id="charCount">0 अक्षर</div>

    <button class="btn btn-primary" onclick="encryptMessage()" id="encryptBtn">
      <div class="radar"></div>
      <span id="encryptBtnText">संदेश सुरक्षित करें</span>
    </button>

    <div class="result" id="createResult">
      <div class="tag" id="createResultTag">सफलता</div>
      <div class="msg" id="createResultMsg"></div>
    </div>
  </div>

  <!-- Read Panel -->
  <div class="panel" id="panelRead">
    <span class="label" id="lblReadPhoto">गुप्त फोटो चुनें</span>
    <div class="photo-drop" onclick="document.getElementById('readFileInput').click()" id="readDropZone">
      <div class="cam-icon">🔍</div>
      <div class="hint">
        <b id="readDropTitle">गुप्त तस्वीर अपलोड करें</b>
        <span id="readDropSub">जिसमें संदेश छुपा है</span>
      </div>
      <img id="readPreviewImg" style="display:none;">
    </div>
    <input type="file" id="readFileInput" accept="image/*" onchange="handleReadImage(this)">

    <button class="btn btn-primary" onclick="decryptMessage()" id="decryptBtn">
      <div class="radar"></div>
      <span id="decryptBtnText">संदेश निकालें</span>
    </button>

    <div class="result" id="readResult">
      <div class="tag" id="readResultTag">परिणाम</div>
      <div class="msg" id="readResultMsg"></div>
    </div>
  </div>
</div>

<canvas id="canvas"></canvas>

<script>
  let currentLang = 'hi';

  function toggleLanguage() {
    currentLang = currentLang === 'hi' ? 'en' : 'hi';
    const btnEl = document.getElementById('langBtn');
    
    if (currentLang === 'en') {
      btnEl.innerText = "हिंदी / EN";
      document.getElementById('app-title').innerText = "Spy Message";
      document.getElementById('tabCreate').innerText = "Hide Message";
      document.getElementById('tabRead').innerText = "Read Message";
      document.getElementById('lblPhoto').innerText = "1. Choose Photo";
      document.getElementById('dropTitle').innerText = "Upload Picture";
      document.getElementById('dropSub').innerText = "Tap to select photo";
      document.getElementById('lblSecret').innerText = "2. Enter Secret Message";
      document.getElementById('secretInput').placeholder = "Type your secret message here...";
      document.getElementById('encryptBtnText').innerText = "Secure Message";
      document.getElementById('lblReadPhoto').innerText = "Choose Secret Photo";
      document.getElementById('readDropTitle').innerText = "Upload Encrypted Picture";
      document.getElementById('readDropSub').innerText = "Containing hidden message";
      document.getElementById('decryptBtnText').innerText = "Extract Message";
    } else {
      btnEl.innerText = "EN / हिंदी";
      document.getElementById('app-title').innerText = "गुप्त संदेश";
      document.getElementById('tabCreate').innerText = "संदेश छुपाएं";
      document.getElementById('tabRead').innerText = "संदेश पढ़ें";
      document.getElementById('lblPhoto').innerText = "1. फोटो चुनें";
      document.getElementById('dropTitle').innerText = "तस्वीर अपलोड करें";
      document.getElementById('dropSub').innerText = "टैप करें या फोटो चुनें";
      document.getElementById('lblSecret').innerText = "2. गुप्त संदेश लिखें";
      document.getElementById('secretInput').placeholder = "यहाँ अपना गुप्त संदेश टाइप करें...";
      document.getElementById('encryptBtnText').innerText = "संदेश सुरक्षित करें";
      document.getElementById('lblReadPhoto').innerText = "गुप्त फोटो चुनें";
      document.getElementById('readDropTitle').innerText = "गुप्त तस्वीर अपलोड करें";
      document.getElementById('readDropSub').innerText = "जिसमें संदेश छुपा है";
      document.getElementById('decryptBtnText').innerText = "संदेश निकालें";
    }
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    if(tab === 'create') {
      document.getElementById('tabCreate').classList.add('active');
      document.getElementById('panelCreate').classList.add('active');
    } else {
      document.getElementById('tabRead').classList.add('active');
      document.getElementById('panelRead').classList.add('active');
    }
  }

  function updateCount() {
    const text = document.getElementById('secretInput').value;
    document.getElementById('charCount').innerText = text.length + (currentLang === 'en' ? ' chars' : ' अक्षर');
  }

  function handleImage(input) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = document.getElementById('previewImg');
        img.src = e.target.result;
        img.style.display = 'block';
      }
      reader.readAsDataURL(input.files[0]);
    }
  }

  function handleReadImage(input) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = document.getElementById('readPreviewImg');
        img.src = e.target.result;
        img.style.display = 'block';
      }
      reader.readAsDataURL(input.files[0]);
    }
  }

  function encryptMessage() {
    const res = document.getElementById('createResult');
    res.className = 'result show ok';
    document.getElementById('createResultTag').innerText = currentLang === 'en' ? 'Success' : 'सफलता';
    document.getElementById('createResultMsg').innerText = currentLang === 'en' ? 'Message encrypted successfully!' : 'संदेश सफलतापूर्वक छुपा दिया गया है!';
  }

  function decryptMessage() {
    const res = document.getElementById('readResult');
    res.className = 'result show ok';
    document.getElementById('readResultTag').innerText = currentLang === 'en' ? 'Extracted Message' : 'प्राप्त संदेश';
    document.getElementById('readResultMsg').innerText = currentLang === 'en' ? 'Sample hidden message decoded.' : 'यहाँ आपका गुप्त संदेश दिखाई देगा।';
  }
</script>

</body>
      </html>
